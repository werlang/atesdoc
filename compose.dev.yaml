services:
    web:
        build: ./web
        restart: unless-stopped
        volumes:
            - ./web:/app
            - node_modules_web:/app/node_modules
        working_dir: /app
        env_file:
            - .env
        ports:
            - 127.0.0.1:80:80
        command: npm run development
        # command: sleep infinity
        networks:
            - atesdoc
    api:
        build: ./api
        restart: unless-stopped
        volumes:
            - ./api:/app
            - node_modules_api:/app/node_modules
        working_dir: /app
        env_file:
            - .env
        ports:
            - 127.0.0.1:8080:8080
        command: npm run development
        # command: sleep infinity
        networks:
            - atesdoc
    chrome:
        image: 'ghcr.io/browserless/chromium:v2.57.3'
        restart: unless-stopped
        shm_size: '2gb'
        environment:
            - CONCURRENT=1
            - TIMEOUT=60000
        networks:
            - atesdoc
volumes:
    node_modules_web:
    node_modules_api:
    chrome_data:
networks:
    atesdoc:
        name: atesdoc
